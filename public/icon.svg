<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6b8e23" />
      <stop offset="50%" stop-color="#556b2f" />
      <stop offset="100%" stop-color="#38491d" />
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Avocado / Olive Green Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glow Border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" />

  <g filter="url(#shadow)">
    <!-- Cupid's Arrow (Tail) -->
    <path d="M 60 410 L 160 310" stroke="url(#arrowGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Feathers -->
    <path d="M 50 420 L 40 450 L 70 440 Z" fill="#fef08a" />
    <path d="M 60 410 L 80 430 L 50 440 Z" fill="#eab308" />
    <path d="M 70 400 L 95 410 L 65 430 Z" fill="#facc15" />

    <!-- Red Heart -->
    <path d="M 256 420 C 256 420 80 320 80 180 C 80 100 140 60 200 60 C 235 60 256 90 256 110 C 256 90 277 60 312 60 C 372 60 432 100 432 180 C 432 320 256 420 256 420 Z" fill="url(#heartGrad)" />
    
    <!-- Specular Highlight on Heart -->
    <path d="M 120 160 C 120 110 160 85 200 85 C 215 85 230 92 240 105 C 230 115 200 120 170 140 C 145 155 130 180 125 200 C 122 185 120 172 120 160 Z" fill="white" opacity="0.35" />

    <!-- Cupid's Arrow (Tip exiting heart) -->
    <path d="M 330 140 L 430 40" stroke="url(#arrowGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Arrow Head -->
    <polygon points="450,20 400,35 435,70" fill="url(#arrowGrad)" />
  </g>
</svg>
